# ---------------------------------------------------------------
# FoodWise - default profile uses H2 (a file-based SQL database),
# so anyone can clone and run with zero setup.
# For MySQL run with:  ./mvnw -Dspring-boot.run.profiles=mysql
# ---------------------------------------------------------------
spring.application.name=foodwise
server.port=${PORT:8080}

# H2 in MySQL compatibility mode -> the same SQL works on both databases.
spring.datasource.url=jdbc:h2:file:./data/foodwise;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
# Browse the dev database at http://localhost:8080/h2-console (JDBC URL above, user "sa")
spring.h2.console.enabled=true

# Flyway owns the schema (src/main/resources/db/migration). Hibernate never changes tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# FoodWise settings
# Insert ~20 sample pantry items + 5 months of history when the pantry table is empty.
foodwise.demo-data=true
# Daily expiry check (sec min hour day month weekday). Also runs once at startup.
foodwise.alerts.cron=0 0 8 * * *

# Vaadin: auto-open the browser on start in dev mode
vaadin.launch-browser=true
