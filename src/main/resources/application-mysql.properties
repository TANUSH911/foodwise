# MySQL profile. Create the database once:
#   CREATE DATABASE foodwise CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Then run:  ./mvnw -Dspring-boot.run.profiles=mysql
# Credentials come from environment variables so they never get committed.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/foodwise?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
